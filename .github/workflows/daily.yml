name: publish-and-deploy

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 글 1편 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:         # 수동 실행 버튼
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

# 한 번에 하나씩만 실행 (커밋 충돌 방지). 대기 중인 실행은 최신 1개만 유지됨
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.flag.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 스케줄/수동 실행일 때만 새 글 생성 (push 때는 건너뜀)
      - name: Generate post
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
        run: npm run generate

      - name: Commit new posts
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "wooabrief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A src/content/posts data
          if git diff --staged --name-only | grep -q '^src/content/posts/'; then
            git commit -m "chore: new post $(date -u +%FT%H:%MZ)"
            git pull --rebase -q || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 새 글이 없는 10분 회차는 빌드·배포를 건너뜀
      - name: Decide deploy
        id: flag
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.flag.outputs.deploy == 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.flag.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
